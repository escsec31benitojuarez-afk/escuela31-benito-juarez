<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área privada</title><style>body{margin:0;font-family:Arial;background:#f3f7f4;color:#25362e}header{padding:25px 5vw;background:#06452b;color:#fff}main{max-width:1100px;margin:auto;padding:28px 5vw}.panel{background:#fff;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #dce8e1;border-radius:14px;padding:16px}a,button,select{padding:10px 13px;border-radius:10px;border:0;font-weight:700;text-decoration:none}.card a{display:inline-block;background:#0b5a35;color:#fff}.denied{opacity:.5}</style></head><body><div style="padding:10px 18px;background:#eef5f1;border-bottom:1px solid #cfded5;font-family:Arial"><a href="../index.html" style="color:#0b5a35;font-weight:700;text-decoration:none">← Volver al sitio institucional</a></div><header><h1>Área privada de Benito IA</h1><p id="idn"></p><select id="profile"></select> <button id="logout">Cerrar sesión</button></header><main><section class="panel"><strong>Preproducción:</strong> no cargar datos personales reales.</section><section class="panel"><h2>Accesos por perfil</h2><div id="modules" class="grid"></div></section><section class="panel"><a href="security-audit.html">Auditoría</a> · <a href="access-matrix.html">Roles y permisos</a> · <a href="data-governance.html">Gobernanza de datos</a></section></main><script src="benito-ia/config.js"></script><script src="benito-ia/governance/roles.js"></script><script src="benito-ia/governance/data-classification.js"></script><script src="benito-ia/auth/demo-users.js"></script><script src="benito-ia/audit/security-audit.js"></script><script src="benito-ia/auth/auth-manager.js"></script><script src="benito-ia/access/access-control.js"></script><script>BenitoAccess.requirePage({permission:'view:institutional',level:'institutional',resource:'private-dashboard'});const s=BenitoAuth.getSession(),r=BenitoAuth.currentRole();idn.textContent=s.displayName+' · '+r.name;profile.innerHTML=s.availableProfiles.map(x=>'<option value="'+x+'" '+(x===s.activeProfile?'selected':'')+'>'+BenitoAuth.role(x).name+'</option>').join('');profile.onchange=()=>{BenitoAuth.switchProfile(profile.value);location.reload()};logout.onclick=()=>{BenitoAuth.logout();location.href='login.html'};const M=[['Administración técnica','*','confidential','platform-owner.html'],['Sistema Multiagente','use:multiagent','institutional','multiagent-lab.html'],['Centro de Conocimiento','manage:knowledge_base','institutional','admin.html'],['Panel del piloto','view:technology_metrics','institutional','pilot-dashboard.html'],['Trayectorias','view:trajectories','reserved','protected-placeholder.html?module=Trayectorias']];M.forEach(m=>{const a=BenitoAccess.authorize({permission:m[1],level:m[2],resource:m[0]}),e=document.createElement('div');e.className='card '+(a.allowed?'':'denied');e.innerHTML='<h3>'+m[0]+'</h3><p>Nivel: '+m[2]+'</p>'+(a.allowed?'<a href="'+m[3]+'">Abrir</a>':'Sin permiso');modules.append(e)});</script></body></html>
