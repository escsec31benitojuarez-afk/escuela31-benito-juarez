<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memoria autorizada · Benito IA</title><meta name="robots" content="noindex, nofollow"><style>
body{margin:0;font-family:Arial;background:#f3f7f4;color:#26372f}header{padding:30px 5vw;background:#06452b;color:#fff}
main{max-width:900px;margin:auto;padding:30px 5vw}.panel{background:#fff;padding:22px;border-radius:18px;margin-bottom:16px}
input,select{width:100%;padding:10px;border:1px solid #dce7e0;border-radius:9px;margin:5px 0 12px}
button,a{display:inline-block;padding:10px 13px;border:0;border-radius:10px;background:#0b5a35;color:#fff;text-decoration:none;font-weight:700;cursor:pointer;margin:4px}
.item{padding:12px;border:1px solid #e1e9e4;border-radius:12px;margin:8px 0}.note{padding:13px;background:#fff8d9;border-left:5px solid #f4c430;border-radius:10px}
</style></head><body>
<header><h1>Memoria autorizada</h1><p>El usuario decide qué se guarda y puede eliminarlo en cualquier momento</p></header>
<main>
<section class="panel note">La memoria está desactivada por defecto. No se deben guardar datos sensibles, calificaciones individuales, DNI, diagnósticos ni situaciones privadas.</section>
<section class="panel">
<label><input id="enabled" type="checkbox" style="width:auto"> Habilitar memoria autorizada en este navegador</label>
<h2>Agregar una preferencia</h2>
<label>Etiqueta<input id="label" placeholder="Ejemplo: Curso habitual"></label>
<label>Valor<input id="value" placeholder="Ejemplo: 2.º A"></label>
<label>Tipo<select id="type"><option value="preference">Preferencia</option><option value="workflow">Flujo de trabajo</option><option value="resource">Recurso frecuente</option></select></label>
<button id="add">Guardar con autorización</button><button id="clear">Borrar toda la memoria</button><a href="multiagent-lab.html">Volver</a>
</section>
<section class="panel"><h2>Elementos guardados</h2><div id="items"></div></section>
</main>
<script src="benito-ia/memory/authorized-memory.js"></script>
<script>
const enabled=document.querySelector('#enabled'),items=document.querySelector('#items');
function render(){const d=BenitoAuthorizedMemory.load();enabled.checked=d.enabled;items.innerHTML=d.items.length?d.items.map(x=>`<div class="item"><strong>${x.label}</strong><p>${x.value}</p><small>${x.type} · ${x.scope}</small><br><button data-id="${x.id}">Eliminar</button></div>`).join(''):'No hay información guardada.'}
enabled.onchange=()=>BenitoAuthorizedMemory.enable(enabled.checked);
document.querySelector('#add').onclick=()=>{const r=BenitoAuthorizedMemory.remember({label:document.querySelector('#label').value.trim(),value:document.querySelector('#value').value.trim(),type:document.querySelector('#type').value,scope:'browser'});if(!r.saved)alert('Primero habilitá la memoria autorizada.');render()};
items.onclick=e=>{if(e.target.dataset.id){BenitoAuthorizedMemory.forget(e.target.dataset.id);render()}};
document.querySelector('#clear').onclick=()=>{if(confirm('¿Borrar toda la memoria autorizada?')){BenitoAuthorizedMemory.clear();render()}};
render();
</script><script src="benito-ia/governance/roles.js"></script><script src="benito-ia/governance/data-classification.js"></script><script src="benito-ia/auth/demo-users.js"></script><script src="benito-ia/audit/security-audit.js"></script><script src="benito-ia/auth/auth-manager.js"></script><script src="benito-ia/access/access-control.js"></script><script>BenitoAccess.requirePage({permission:'view:institutional',level:'institutional',resource:'memory.html'});</script></body></html>
