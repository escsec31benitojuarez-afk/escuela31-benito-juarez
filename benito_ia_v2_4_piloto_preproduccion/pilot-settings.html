<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configuración del piloto · Benito IA</title><style>
body{margin:0;font-family:Arial;background:#f3f7f4;color:#26372f}header{padding:30px 5vw;background:#06452b;color:#fff}
main{max-width:850px;margin:auto;padding:30px 5vw}.panel{background:#fff;padding:22px;border-radius:18px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid #e7ece9}button,a{display:inline-block;padding:10px 13px;border:0;border-radius:10px;background:#0b5a35;color:#fff;text-decoration:none;font-weight:700;cursor:pointer;margin:4px}
.note{padding:13px;border-left:5px solid #f4c430;background:#fff8d9;border-radius:10px}
</style></head><body><header><h1>Configuración del piloto</h1><p>Activación gradual de capacidades</p></header><main>
<section class="panel"><div id="flags"></div><button id="save">Guardar</button><button id="reset">Restablecer</button><a href="pilot-dashboard.html">Panel del piloto</a></section>
<section class="panel note">Estas banderas solo afectan esta copia privada y este navegador. No modifican el sitio institucional.</section>
<script src="benito-ia/pilot/feature-flags.js"></script>
<script>
const labels={assistant:'Asistente',rag:'RAG local',iagSimulation:'Simulación IAG',externalIAG:'IAG externa',feedback:'Retroalimentación',telemetry:'Telemetría',discovery:'Modo descubrimiento',knowledgeAdmin:'Centro de Conocimiento'};
const flags=BenitoFeatureFlags.load(),wrap=document.querySelector('#flags');
Object.keys(flags).forEach(k=>{const r=document.createElement('label');r.className='row';r.innerHTML=`<span><strong>${labels[k]||k}</strong></span><input type="checkbox" data-key="${k}" ${flags[k]?'checked':''}>`;wrap.appendChild(r)});
document.querySelector('#save').onclick=()=>{const next={};document.querySelectorAll('[data-key]').forEach(x=>next[x.dataset.key]=x.checked);BenitoFeatureFlags.save(next);alert('Configuración guardada.')};
document.querySelector('#reset').onclick=()=>{BenitoFeatureFlags.reset();location.reload()};
</script></main></body></html>
