<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio de datos analíticos</title>
<style>body{font-family:Arial;margin:0;background:#f3f7f4;color:#26372f}header{padding:26px 5vw;background:#06452b;color:#fff}main{max-width:900px;margin:auto;padding:28px 5vw}.panel{background:#fff;border-radius:18px;padding:20px;margin-bottom:15px}textarea{width:100%;min-height:220px;padding:12px;font-family:monospace;border:1px solid #cfded5;border-radius:10px}button,a{padding:10px 13px;border:0;border-radius:10px;background:#0b5a35;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.warning{background:#fff3c9;border-left:6px solid #f4c430}</style></head>
<body><header><h1>Laboratorio de datos anonimizados</h1></header><main>
<section class="panel warning"><strong>Restricción activa:</strong> no se permite cargar nombres, DNI, domicilios, teléfonos, datos de salud ni información nominal. El laboratorio solo valida estructuras agregadas.</section>
<section class="panel"><h2>Validar JSON agregado</h2><textarea id="input" placeholder='Pegue aquí un conjunto agregado con meta, courses, subjects y periods'></textarea><p><button id="validate">Validar</button></p><pre id="result"></pre></section>
<a href="analytics-dashboard.html">← Volver al Motor Analítico</a></main>
<script src="benito-ia/config.js"></script><script src="benito-ia/governance/roles.js"></script><script src="benito-ia/governance/data-classification.js"></script><script src="benito-ia/auth/demo-users.js"></script><script src="benito-ia/audit/security-audit.js"></script><script src="benito-ia/auth/auth-manager.js"></script><script src="benito-ia/access/access-control.js"></script><script src="benito-ia/security/sensitive-data-guard.js"></script><script src="benito-ia/analytics/quality/data-quality.js"></script>
<script>
BenitoAccess.requirePage({permission:'*',level:'confidential',resource:'analytics-data-lab'});
validate.onclick=()=>{
 const raw=input.value,guard=BenitoSensitiveDataGuard.inspect(raw);
 if(!guard.safe){result.textContent='Carga rechazada. Posibles datos protegidos: '+guard.findings.map(x=>x.label).join(', ');BenitoSecurityAudit.log('analytics_import_rejected',{profile:BenitoAuth.getSession()?.activeProfile,resource:'analytics-data-lab',level:'confidential',outcome:'denied',reason:'sensitive_data_detected'});return}
 try{const data=JSON.parse(raw),q=BenitoDataQuality.validate(data);result.textContent=JSON.stringify(q,null,2)}
 catch(e){result.textContent='JSON inválido: '+e.message}
};
</script></body></html>
