<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso privado · Benito IA</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef5f1;font-family:Arial;color:#24362d}.card{width:min(92vw,470px);background:#fff;border-radius:22px;padding:28px;box-shadow:0 24px 60px #05351f22}input{width:100%;padding:12px;border:1px solid #cfded5;border-radius:10px;margin:6px 0 12px;box-sizing:border-box}button,a{padding:11px 14px;border-radius:10px;font-weight:700;text-decoration:none}button{border:0;background:#0b5a35;color:#fff;width:100%}.warn{background:#fff7d6;border-left:5px solid #f4c430;padding:12px;border-radius:10px}.demo{font-size:.8rem;background:#f3f7f4;padding:10px;border-radius:10px;margin-top:14px}</style></head><body><main class="card"><p><a href="../index.html">← Sitio institucional</a></p><h1>🔐 Área privada de Benito IA</h1><p>Acceso restringido a personas autorizadas.</p><div class="warn"><strong>Entorno de demostración.</strong> No utilizar con datos reales.</div><form id="form"><label>Usuario</label><input id="user" required><label>Contraseña</label><input id="pass" type="password" required><button>Ingresar</button><p id="msg"></p></form><div class="demo">Usuario: alfredo.demo<br>Contraseña: Benito-Local-2026!</div><p><a href="../index.html">← Volver al sitio institucional</a></p></main><script src="benito-ia/config.js?v=6.0.1"></script><script src="benito-ia/governance/roles.js?v=6.0.1"></script><script src="benito-ia/governance/data-classification.js?v=6.0.1"></script><script src="benito-ia/auth/demo-users.js?v=6.0.1"></script><script src="benito-ia/audit/security-audit.js?v=6.0.1"></script><script src="benito-ia/auth/auth-manager.js?v=6.0.1"></script><script>
(function(){
 const params=new URLSearchParams(location.search);
 const requested=params.get('next');
 const safeNext=(requested&&/^[a-zA-Z0-9._-]+(?:#[a-zA-Z0-9_-]+)?$/.test(requested))?requested:'dashboard.html';
 const existing=BenitoAuth.getSession();
 if(existing){location.replace(safeNext);return;}
 form.onsubmit=function(e){
  e.preventDefault();msg.textContent='';
  const result=BenitoAuth.login(user.value.trim(),pass.value);
  if(!result.ok){msg.textContent=result.error;msg.style.color='#a12222';return;}
  msg.textContent='Acceso correcto. Abriendo el Dashboard…';msg.style.color='#0b5a35';
  location.replace(safeNext);
 };
})();
</script></body></html>
