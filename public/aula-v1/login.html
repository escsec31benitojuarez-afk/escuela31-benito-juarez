<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#123c33"><title>Ingresar | Aula Digital Benito Juárez</title><link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/aula.css"></head>
<body><a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="site-header"><a class="brand" href="./login.html" aria-label="Aula Digital Benito Juárez"><img src="./assets/logo-mark.svg" alt=""><span class="brand-copy"><strong>Aula Digital</strong><span>Escuela Secundaria N.º 31 “Benito Juárez”</span></span></a><span class="restricted-label">Acceso institucional restringido</span></header>
<main id="contenido" class="page-shell page-shell--narrow"><section class="auth-card" aria-labelledby="login-title"><p class="eyebrow">Bienvenido/a</p><h1 id="login-title">Ingresá a tu curso</h1><p class="lead">Usá el usuario y la contraseña proporcionados por la escuela.</p>
<form id="login-form" novalidate><div class="form-field"><label for="user">Usuario</label><input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" required aria-describedby="user-hint"><span id="user-hint" class="field-hint">Ejemplo: 1A</span></div><div class="form-field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button id="login-button" class="button button--wide" type="submit">Ingresar</button><div id="login-message" class="message" role="status" aria-live="polite"></div></form></section></main>
<footer class="footer">Aula Digital · Espacio pedagógico institucional · V1.0.0</footer><script type="module" src="./js/login.js"></script></body></html>
